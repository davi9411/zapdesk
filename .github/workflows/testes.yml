name: testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: sintaxe
        run: for f in src/*.mjs src/*/*.mjs; do node --check "$f"; done
      - run: npm test

  # Imagem Docker: testa o build em todo push/PR e publica no GHCR quando entra na main.
  imagem:
    needs: testes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: a imagem sobe e os módulos carregam
        if: github.event_name == 'push'
        run: |
          docker run --rm ghcr.io/${{ github.repository }}:${{ github.sha }} node --input-type=module -e "
            await import('/app/src/sistema.mjs'); await import('/app/src/regras/limpeza.mjs');
            const { abrirDb } = await import('/app/src/armazenamento/db.mjs'); abrirDb();
            console.log('ok', process.platform);"
          docker run --rm ghcr.io/${{ github.repository }}:${{ github.sha }} sh -c 'ffmpeg -version | head -1 && $WA_PYTHON -c "import faster_whisper; print(\"whisper ok\")" && claude --version'
