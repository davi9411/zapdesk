<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zapdesk painel</title>
<style>
  :root {
    --fundo: #f3f4f7; --painel: #ffffff; --linha: #e6e8ee; --texto: #1b1d24; --suave: #727889;
    --sel: #eef0f6; --cliente: #ffffff; --dante: #e2f5e9; --equipe: #e5eafc; --aviso: #fdf3dc;
    --acento: #5b5bd6; --acento-t: #ffffff; --sombra: 0 1px 2px rgba(20,24,40,.06), 0 4px 14px rgba(20,24,40,.05);
    --verde: #17803d; --azul: #3a5bd9; --ambar: #a86a05; --vermelho: #c23b3b; --cinza: #727889;
    --verde-f: #e3f5e9; --azul-f: #e6ebfc; --ambar-f: #fcf0d6; --vermelho-f: #fbe5e5; --cinza-f: #eceef3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fundo: #0f1015; --painel: #17181f; --linha: #262833; --texto: #eceef5; --suave: #8f95a8;
      --sel: #20222c; --cliente: #1e2029; --equipe: #202a52; --aviso: #3a321a;
      --dante: #173a26; --acento: #8283f5; --acento-t: #0f1015; --sombra: 0 1px 2px rgba(0,0,0,.4);
      --verde: #62d38b; --azul: #8ea6f7; --ambar: #eab25a; --vermelho: #f08585; --cinza: #8f95a8;
      --verde-f: #153324; --azul-f: #1d2750; --ambar-f: #3a2f15; --vermelho-f: #3d1b1d; --cinza-f: #242632;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fundo); color: var(--texto); font: 14px/1.45 system-ui, 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; }
  button { font: inherit; }
  header { display: flex; align-items: center; gap: 18px; padding: 12px 20px; background: var(--painel); border-bottom: 1px solid var(--linha); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; font-weight: 700; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
  header h1::before { content: ''; width: 10px; height: 10px; border-radius: 3px; background: var(--acento); }
  .saude { display: flex; gap: 8px; flex-wrap: wrap; font-size: 12px; }
  .saude span { background: var(--cinza-f); color: var(--suave); padding: 3px 10px; border-radius: 999px; }
  .saude b { font-weight: 600; }
  .ok { color: var(--verde); } .ruim { color: var(--vermelho); }
  main { flex: 1; display: grid; grid-template-columns: minmax(300px, 390px) 1fr; min-height: 0; gap: 12px; padding: 12px; }
  aside, section { background: var(--painel); border: 1px solid var(--linha); border-radius: 14px; box-shadow: var(--sombra); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .filtros { padding: 12px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--linha); }
  input[type=search] { width: 100%; padding: 9px 12px; border: 1px solid var(--linha); border-radius: 10px; background: var(--fundo); color: var(--texto); font: inherit; outline: none; }
  input[type=search]:focus, textarea:focus { border-color: var(--acento); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 0; background: var(--cinza-f); color: var(--suave); border-radius: 999px; padding: 4px 11px; font-size: 12px; cursor: pointer; }
  .chip:hover { background: var(--sel); }
  .chip[aria-pressed=true] { background: var(--acento); color: var(--acento-t); }
  #lista { overflow-y: auto; flex: 1; padding: 6px; }
  .item { padding: 10px; border-radius: 10px; cursor: pointer; display: grid; grid-template-columns: 38px 1fr; gap: 2px 10px; align-items: center; }
  .item:hover { background: var(--sel); }
  .item.atual { background: var(--sel); box-shadow: inset 3px 0 0 var(--acento); }
  .avatar { grid-row: span 2; width: 38px; height: 38px; border-radius: 50%; background: var(--azul-f); color: var(--azul); display: grid; place-items: center; font-weight: 700; font-size: 15px; }
  .linha1 { display: flex; justify-content: space-between; gap: 8px; }
  .nome { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hora { color: var(--suave); font-size: 11px; flex: none; }
  .previa { color: var(--suave); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rodape { grid-column: 2; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 4px; }
  .selo { font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
  .s-dante { color: var(--verde); background: var(--verde-f); } .s-vai-responder { color: var(--azul); background: var(--azul-f); }
  .s-esperando-cliente, .s-fora, .s-sem-dante { color: var(--cinza); background: var(--cinza-f); }
  .s-equipe { color: var(--azul); background: var(--azul-f); } .s-aguardando-equipe, .s-caso, .s-silenciado { color: var(--ambar); background: var(--ambar-f); }
  .s-pausado { color: var(--vermelho); background: var(--vermelho-f); }
  .mini { border: 1px solid var(--linha); background: var(--painel); color: var(--texto); border-radius: 999px; padding: 2px 10px; font-size: 11px; cursor: pointer; }
  .mini:hover { background: var(--sel); }
  .mini.forte { background: var(--acento); border-color: var(--acento); color: var(--acento-t); font-weight: 600; }
  .abas { display: flex; gap: 4px; padding: 10px 14px 0; border-bottom: 1px solid var(--linha); }
  .aba { border: 0; background: transparent; padding: 8px 14px; color: var(--suave); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .aba[aria-selected=true] { color: var(--texto); border-bottom-color: var(--acento); font-weight: 600; }
  .cab { padding: 14px 18px; border-bottom: 1px solid var(--linha); display: grid; gap: 6px; }
  .cab h2 { margin: 0; font-size: 18px; letter-spacing: -.01em; }
  .meta { color: var(--suave); font-size: 13px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .acoes { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
  .btn { border: 1px solid var(--linha); background: var(--painel); color: var(--texto); border-radius: 9px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  .btn:hover { background: var(--sel); }
  .btn.forte { background: var(--acento); border-color: var(--acento); color: var(--acento-t); font-weight: 600; }
  .btn.forte:hover { opacity: .9; }
  .btn.perigo { color: var(--vermelho); border-color: var(--vermelho-f); background: var(--vermelho-f); }
  .btn:disabled { opacity: .5; cursor: default; }
  .corpo { flex: 1; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; background: var(--fundo); }
  .msg { max-width: 72%; padding: 8px 12px; border-radius: 14px 14px 14px 4px; background: var(--cliente); box-shadow: var(--sombra); white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg small { display: block; color: var(--suave); font-size: 11px; margin-bottom: 2px; }
  .msg.dante, .msg.equipe, .msg.aviso, .msg.fila { align-self: flex-end; border-radius: 14px 14px 4px 14px; }
  .msg.dante { background: var(--dante); } .msg.equipe { background: var(--equipe); } .msg.aviso { background: var(--aviso); }
  .msg.fila { background: transparent; border: 1px dashed var(--suave); box-shadow: none; }
  .msg.fila.falhou { border-color: var(--vermelho); }
  .msg .mini { margin-left: 8px; }
  .vazio { color: var(--suave); margin: auto; text-align: center; padding: 20px; }
  .caixa { padding: 16px; overflow-y: auto; display: grid; gap: 14px; align-content: start; background: var(--fundo); }
  .cartao { border: 1px solid var(--linha); background: var(--painel); border-radius: 12px; padding: 14px 16px; box-shadow: var(--sombra); }
  .cartao h3 { margin: 0 0 8px; font-size: 14px; }
  .caso { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 8px 0; border-top: 1px solid var(--linha); }
  .caso:first-of-type { border-top: 0; }
  .caso span { flex: 1; font-size: 13px; }
  pre { margin: 0; font: 12px/1.5 ui-monospace, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--suave); }
  form.resp { border-top: 1px solid var(--linha); padding: 12px 18px; display: grid; gap: 8px; }
  textarea { width: 100%; min-height: 64px; max-height: 220px; resize: vertical; padding: 10px 12px; border: 1px solid var(--linha); border-radius: 10px; background: var(--fundo); color: var(--texto); font: inherit; outline: none; }
  .linhaform { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .linhaform .aviso { color: var(--suave); font-size: 12px; flex: 1; min-width: 200px; }
  .linhaform label { color: var(--suave); font-size: 12px; display: flex; align-items: center; gap: 6px; }
  input[type=datetime-local], input[type=time], input[type=date], select { padding: 5px 8px; border: 1px solid var(--linha); border-radius: 8px; background: var(--fundo); color: var(--texto); font: inherit; font-size: 12px; }
  .enviar { border: 0; background: var(--acento); color: var(--acento-t); font-weight: 600; padding: 8px 20px; border-radius: 10px; cursor: pointer; }
  .enviar:disabled { opacity: .5; cursor: default; }
  .erro { color: var(--vermelho); font-size: 13px; }
  #aviso { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--texto); color: var(--painel); padding: 9px 16px; border-radius: 10px; font-size: 13px; box-shadow: var(--sombra); display: none; z-index: 5; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } aside { max-height: 45vh; } }
</style>
</head>
<body>
<header>
  <h1>Zapdesk</h1>
  <div class="saude" id="saude">carregando…</div>
  <button class="btn" id="pausa" style="margin-left:auto" title="Mesmo que PAUSAR/RETOMAR no WhatsApp pessoal">Pausar o Dante</button>
</header>
<main>
  <aside>
    <div class="filtros">
      <input type="search" id="busca" placeholder="Buscar nome ou número">
      <div class="chips" id="chips"></div>
    </div>
    <div id="lista"></div>
  </aside>
  <section>
    <div class="abas" role="tablist">
      <button class="aba" role="tab" id="aba-conversa" aria-selected="true">Conversa</button>
      <button class="aba" role="tab" id="aba-dante" aria-selected="false">Dante</button>
      <button class="aba" role="tab" id="aba-rotinas" aria-selected="false">Rotinas</button>
    </div>
    <div id="painel-conversa" style="display:flex;flex-direction:column;flex:1;min-height:0">
      <div class="cab" id="cab"><span class="meta">Escolha uma conversa à esquerda.</span></div>
      <div class="corpo" id="msgs"></div>
      <form class="resp" id="resp" style="display:none">
        <textarea id="texto" placeholder="Responder como Davi (Ctrl+Enter envia)"></textarea>
        <div class="linhaform">
          <span class="aviso" id="avisoDante">Sai com o cabeçalho “Davi | CEO e Desenvolvedor DS Trade”. Ao enviar, o Dante para de responder este cliente por 12 h, a menos que você marque “Dante continua atendendo”.</span>
          <label title="Marcado: a sua mensagem não faz o Dante parar de responder"><input type="checkbox" id="continua"> Dante continua atendendo</label>
          <label>Programar para <input type="datetime-local" id="quando"></label>
          <button class="enviar" id="enviar" type="submit">Enviar</button>
        </div>
        <div class="erro" id="erroEnvio"></div>
      </form>
    </div>
    <div class="caixa" id="painel-dante" style="display:none"></div>
    <div class="caixa" id="painel-rotinas" style="display:none"></div>
  </section>
</main>
<div id="aviso"></div>
<script>
const ROTULOS = {
  dante: 'Dante atendendo', 'vai-responder': 'Dante vai responder', 'esperando-cliente': 'Esperando o cliente',
  equipe: 'Equipe atendendo', 'aguardando-equipe': 'Aguardando equipe', caso: 'Caso aberto', pausado: 'Pausado', fora: 'Fora do Dante', 'sem-dante': 'Sem Dante', silenciado: 'Silenciado',
};
const $ = (id) => document.getElementById(id);
const TOKEN = '__TOKEN__';
const estado = { conversas: [], atual: null, filtro: new Set(), busca: '', aba: 'conversa' };

const el = (tag, cls, texto) => { const e = document.createElement(tag); if (cls) e.className = cls; if (texto != null) e.textContent = texto; return e; };
const hora = (ts) => {
  const d = new Date(ts * 1000), h = new Date();
  const mesmoDia = d.toDateString() === h.toDateString();
  return mesmoDia ? d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
    : d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }) + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
};
const restante = (ate) => {
  const s = ate - Math.floor(Date.now() / 1000);
  if (s <= 0) return '';
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h >= 24 ? `volta em ${Math.floor(h / 24)} d ${h % 24} h` : `volta em ${h} h ${m} min`;
};
let tAviso;
const avisar = (msg) => { const a = $('aviso'); a.textContent = msg; a.style.display = 'block'; clearTimeout(tAviso); tAviso = setTimeout(() => { a.style.display = 'none'; }, 3500); };
const post = async (url, corpo) => {
  const r = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json', 'x-painel-token': TOKEN }, body: JSON.stringify(corpo) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.erro || r.status);
  return j;
};
const api = async (url) => { const r = await fetch(url, { cache: 'no-store' }); if (!r.ok) throw new Error((await r.json()).erro || r.status); return r.json(); };

// botão que chama a API, avisa o resultado e atualiza a tela
function botao(cls, rotulo, rota, corpo, { confirmar, ok } = {}) {
  const b = el('button', cls, rotulo);
  b.onclick = async (ev) => {
    ev.stopPropagation();
    if (confirmar && !confirm(confirmar)) return;
    b.disabled = true;
    try { await post(rota, corpo); avisar(ok || 'Pronto.'); await ciclo(); } catch (e) { avisar(e.message); }
    b.disabled = false;
  };
  return b;
}
const fecharCaso = (cls, c) => botao(cls, `Fechar caso #${c.casoAberto}`, '/api/fechar-caso', { id: c.casoAberto }, { ok: `Caso #${c.casoAberto} fechado.` });

function desenharChips() {
  const caixa = $('chips');
  caixa.replaceChildren();
  for (const [codigo, rotulo] of Object.entries(ROTULOS)) {
    const n = estado.conversas.filter((c) => c.status.codigo === codigo).length;
    if (!n && !estado.filtro.has(codigo)) continue;
    const b = el('button', 'chip', `${rotulo} ${n}`);
    b.setAttribute('aria-pressed', estado.filtro.has(codigo));
    b.onclick = () => { estado.filtro.has(codigo) ? estado.filtro.delete(codigo) : estado.filtro.add(codigo); desenharLista(); desenharChips(); };
    caixa.append(b);
  }
}

function desenharLista() {
  const q = estado.busca.toLowerCase();
  const itens = estado.conversas.filter((c) =>
    (!estado.filtro.size || estado.filtro.has(c.status.codigo)) && (!q || c.nome.toLowerCase().includes(q) || c.numero.includes(q)));
  const lista = $('lista');
  lista.replaceChildren();
  if (!itens.length) lista.append(el('div', 'vazio', 'Nenhuma conversa.'));
  for (const c of itens) {
    const i = el('div', 'item' + (c.jid === estado.atual ? ' atual' : ''));
    const l1 = el('div', 'linha1');
    l1.append(el('span', 'nome', c.nome), el('span', 'hora', c.ultima_ts ? hora(c.ultima_ts) : ''));
    const rod = el('div', 'rodape');
    rod.append(el('span', `selo s-${c.status.codigo}`, c.status.rotulo + (c.status.ate ? ' · ' + restante(c.status.ate) : '')));
    if (c.casoAberto && c.status.codigo !== 'caso') rod.append(el('span', 'selo s-caso', `caso #${c.casoAberto}`));
    if (c.casoAberto) rod.append(fecharCaso('mini forte', c));
    if (['equipe', 'aguardando-equipe'].includes(c.status.codigo)) rod.append(botao('mini', 'Dante assume', '/api/assumir', { jid: c.jid }, { ok: 'O Dante assume de volta.' }));
    i.append(el('div', 'avatar', (c.nome || '?').trim().charAt(0).toUpperCase()), l1, el('div', 'previa', (c.ultimaMeu ? 'você: ' : '') + c.previa), rod);
    i.onclick = () => { estado.atual = c.jid; mostrar('conversa'); desenharLista(); carregarConversa(); };
    lista.append(i);
  }
}

async function carregarConversas() {
  estado.conversas = await api('/api/conversas');
  desenharChips();
  desenharLista();
}

async function carregarConversa() {
  if (!estado.atual) return;
  const d = await api('/api/conversas/' + encodeURIComponent(estado.atual));
  const cab = $('cab');
  cab.replaceChildren();
  cab.append(el('h2', null, d.nome));
  const meta = el('div', 'meta');
  meta.append(el('span', `selo s-${d.status.codigo}`, d.status.rotulo + (d.status.ate ? ' · ' + restante(d.status.ate) : '')), el('span', null, '+' + d.numero));
  if (d.perfil) meta.append(el('span', null, 'perfil: ' + d.perfil));
  if (d.origem) meta.append(el('span', null, 'origem: ' + d.origem));
  if (d.etiquetas.length) meta.append(el('span', null, d.etiquetas.join(' · ')));
  cab.append(meta, el('div', 'meta', d.status.detalhe));
  const acoes = el('div', 'acoes');
  const jid = d.jid;
  for (const k of (d.casos || []).filter((x) => x.status === 'aberto')) {
    acoes.append(botao('btn forte', `Fechar caso #${k.id}`, '/api/fechar-caso', { id: k.id }, { ok: `Caso #${k.id} fechado.` }));
  }
  if (['equipe', 'aguardando-equipe'].includes(d.status.codigo)) acoes.append(botao('btn', 'Dante assume de volta', '/api/assumir', { jid }, { ok: 'O Dante assume de volta.' }));
  if (d.status.codigo === 'silenciado') acoes.append(botao('btn', 'Reativar o Dante aqui', '/api/reativar', { jid }, { ok: 'Dante reativado.' }));
  else if (d.status.codigo !== 'fora') {
    acoes.append(botao('btn', 'Silenciar por 24 h', '/api/silenciar', { jid, horas: 24 }, { ok: 'Dante silenciado por 24 h.' }), botao('btn perigo', 'Silenciar o Dante aqui', '/api/silenciar', { jid }, { ok: 'Dante silenciado até você reativar.' }));
  }
  cab.append(acoes);
  const corpo = $('msgs');
  const noFim = corpo.scrollHeight - corpo.scrollTop - corpo.clientHeight < 80;
  corpo.replaceChildren();
  for (const m of d.msgs) {
    const classe = m.quem === 'CLIENTE' ? '' : m.quem === 'EQUIPE' ? ' equipe' : m.quem === 'AVISO' ? ' aviso' : ' dante';
    const b = el('div', 'msg' + classe);
    b.append(el('small', null, `${m.quem === 'CLIENTE' ? d.nome : m.quem} · ${hora(m.ts)}${m.tipo && m.tipo !== 'texto' ? ' · ' + m.tipo : ''}`));
    const t = m.texto || (m.transcricao ? '🎙 ' + m.transcricao : '') || `[${m.tipo || 'mídia'}]`;
    b.append(document.createTextNode(t));
    corpo.append(b);
  }
  for (const o of d.fila.filter((x) => !x.enquete)) {
    const b = el('div', 'msg fila' + (o.status === 'falhou' || o.status === 'atrasada' ? ' falhou' : ''));
    const quando = o.status === 'pendente' && o.enviar_em > Math.floor(Date.now() / 1000) + 5 ? 'programada para ' + hora(o.enviar_em)
      : o.status === 'pendente' || o.status === 'enviando' ? 'enviando…' : o.status + (o.erro ? ': ' + o.erro : '');
    b.append(el('small', null, quando));
    b.append(document.createTextNode((o.texto || '').split('\n\n').slice(o.texto && o.texto.startsWith('> *Davi*') ? 1 : 0).join('\n\n')));
    if (o.status === 'pendente') {
      const c = el('button', 'mini', 'Cancelar');
      c.onclick = async () => { try { await post('/api/cancelar', { id: o.id }); carregarConversa(); } catch (e) { avisar(e.message); } };
      b.append(c);
    }
    corpo.append(b);
  }
  $('resp').style.display = 'grid';
  if (noFim || !corpo.dataset.visto || corpo.dataset.jid !== d.jid) corpo.scrollTop = corpo.scrollHeight;
  corpo.dataset.jid = d.jid;
  corpo.dataset.visto = '1';
}

async function carregarDante() {
  const d = await api('/api/dante');
  const s = $('saude');
  s.replaceChildren();
  const ponto = (rotulo, ok, sim, nao) => { const e = el('span'); e.append(document.createTextNode(rotulo + ' ')); e.append(el('b', ok ? 'ok' : 'ruim', ok ? sim : nao)); return e; };
  s.append(ponto('Dante', d.agenteVivo, 'no ar', 'parado'), ponto('Leitor', d.leitorVivo, 'no ar', 'parado'), ponto('Atendimento', !d.pausado, 'ativo', 'pausado'));
  const f = Object.entries(d.fila).map(([k, v]) => `${v} ${k}`).join(', ');
  $('pausa').textContent = d.pausado ? 'Retomar o Dante' : 'Pausar o Dante';
  $('pausa').className = 'btn' + (d.pausado ? ' forte' : '');
  estado.pausado = d.pausado;
  s.append(el('span', null, 'Fila: ' + (f || 'vazia')));
  s.append(el('span', null, 'Casos abertos: ' + d.casosAbertos.length));

  const caixa = $('painel-dante');
  caixa.replaceChildren();
  const c1 = el('div', 'cartao'); c1.append(el('h3', null, `Casos abertos (${d.casosAbertos.length})`));
  if (!d.casosAbertos.length) c1.append(el('div', 'meta', 'Nenhum.'));
  for (const k of d.casosAbertos) {
    const l = el('div', 'caso');
    l.append(el('span', null, `#${k.id} ${k.nome || ''}: ${k.resumo || ''}`), botao('mini forte', 'Fechar', '/api/fechar-caso', { id: k.id }, { ok: `Caso #${k.id} fechado.` }));
    c1.append(l);
  }
  const c2 = el('div', 'cartao'); c2.append(el('h3', null, 'Log do agente (últimas linhas)'));
  c2.append(el('pre', null, d.log.join('\n') || 'sem log'));
  const c3 = el('div', 'cartao'); c3.append(el('h3', null, 'Ações feitas pelo painel e pelo Claude (últimas)'));
  c3.append(el('pre', null, (d.auditoria || []).map((a) => `${hora(a.ts)}  ${a.origem}  ${a.acao}${a.detalhe ? '  ' + a.detalhe : ''}`).join('\n') || 'nada ainda'));
  caixa.append(c1, c3, c2);
}

const DIAS = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
async function carregarRotinas() {
  const lista = await api('/api/rotinas');
  const caixa = $('painel-rotinas');
  if (caixa.contains(document.activeElement) && document.activeElement.matches('input, textarea, select')) return; // não atrapalha quem está digitando
  caixa.replaceChildren();

  const f = el('form', 'cartao');
  f.append(el('h3', null, 'Nova rotina (a mensagem sai como Davi, no dia e hora escolhidos)'));
  const sel = el('select'); sel.id = 'rotChat';
  for (const c of estado.conversas.filter((x) => x.status.codigo !== 'fora')) { const o = el('option', null, `${c.nome} (+${c.numero})`); o.value = c.jid; sel.append(o); }
  const texto = el('textarea'); texto.id = 'rotTexto'; texto.placeholder = 'Mensagem';
  const dias = el('div', 'linhaform');
  DIAS.forEach((n, i) => { const l = el('label'); const c = el('input'); c.type = 'checkbox'; c.value = i; c.className = 'rotDia'; l.append(c, document.createTextNode(n)); dias.append(l); });
  const hora_ = el('input'); hora_.type = 'time'; hora_.id = 'rotHora'; hora_.value = '09:00';
  const ate = el('input'); ate.type = 'date'; ate.id = 'rotAte';
  const cont = el('input'); cont.type = 'checkbox'; cont.id = 'rotCont'; cont.checked = true;
  const linha = el('div', 'linhaform');
  const l1 = el('label'); l1.append(document.createTextNode('Hora '), hora_);
  const l2 = el('label'); l2.append(document.createTextNode('Até (opcional) '), ate);
  const l3 = el('label'); l3.append(cont, document.createTextNode('Dante continua atendendo'));
  const ok = el('button', 'enviar', 'Criar rotina'); ok.type = 'submit';
  linha.append(l1, l2, l3, ok);
  const erro = el('div', 'erro');
  f.style.display = 'grid'; f.style.gap = '10px';
  f.append(sel, texto, dias, linha, erro);
  f.onsubmit = async (ev) => {
    ev.preventDefault(); erro.textContent = '';
    try {
      await post('/api/rotinas', { jid: sel.value, texto: texto.value, dias: [...document.querySelectorAll('.rotDia')].filter((c) => c.checked).map((c) => Number(c.value)), hora: hora_.value, ate: ate.value || undefined, danteContinua: cont.checked });
      await carregarRotinas();
    } catch (e) { erro.textContent = e.message; }
  };
  caixa.append(f);

  const c = el('div', 'cartao'); c.append(el('h3', null, `Rotinas (${lista.length})`));
  if (!lista.length) c.append(el('div', 'meta', 'Nenhuma rotina criada.'));
  for (const r of lista) {
    const item = el('div', 'caso'); item.style.flexWrap = 'wrap';
    const txt = el('span');
    txt.append(document.createTextNode(`${r.nome || r.chat} · ${r.dias_nomes} às ${r.hora}${r.ate ? ' até ' + r.ate.split('-').reverse().join('/') : ''}${r.ativa ? '' : ' · PAUSADA'}`), el('br'),
      el('small', 'meta', (r.ativa && r.proxima ? 'próxima: ' + hora(r.proxima) + ' · ' : '') + r.texto.slice(0, 120)));
    const ac = el('div', 'acoes');
    const b1 = el('button', 'mini', r.ativa ? 'Pausar' : 'Retomar'); b1.onclick = async () => { await post('/api/rotinas/alternar', { id: r.id, ativa: !r.ativa }); carregarRotinas(); };
    const b2 = el('button', 'mini', 'Apagar'); b2.onclick = async () => { if (confirm('Apagar esta rotina?')) { await post('/api/rotinas/apagar', { id: r.id }); carregarRotinas(); } };
    ac.append(b1, b2); item.append(txt, ac); c.append(item);
  }
  caixa.append(c);
}

function mostrar(aba) {
  estado.aba = aba;
  $('aba-conversa').setAttribute('aria-selected', aba === 'conversa');
  $('aba-dante').setAttribute('aria-selected', aba === 'dante');
  $('aba-rotinas').setAttribute('aria-selected', aba === 'rotinas');
  $('painel-rotinas').style.display = aba === 'rotinas' ? 'grid' : 'none';
  $('painel-conversa').style.display = aba === 'conversa' ? 'flex' : 'none';
  $('painel-dante').style.display = aba === 'dante' ? 'grid' : 'none';
}
$('aba-conversa').onclick = () => mostrar('conversa');
$('aba-rotinas').onclick = () => { mostrar('rotinas'); carregarRotinas().catch(() => {}); };
$('aba-dante').onclick = () => { mostrar('dante'); carregarDante().catch(() => {}); };
$('resp').onsubmit = async (ev) => {
  ev.preventDefault();
  if (!estado.atual) return;
  const texto = $('texto').value.trim();
  if (!texto) return;
  const q = $('quando').value;
  const btn = $('enviar');
  btn.disabled = true; $('erroEnvio').textContent = '';
  try {
    await post('/api/enviar', { jid: estado.atual, texto, em: q ? Math.floor(new Date(q).getTime() / 1000) : undefined, danteContinua: $('continua').checked });
    $('texto').value = ''; $('quando').value = ''; $('continua').checked = false;
    await carregarConversa();
    $('msgs').scrollTop = $('msgs').scrollHeight;
  } catch (e) { $('erroEnvio').textContent = e.message; }
  btn.disabled = false;
};
$('texto').onkeydown = (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) $('resp').requestSubmit(); };
$('pausa').onclick = async () => {
  if (!estado.pausado && !confirm('Pausar o Dante? Ele para de responder TODOS os clientes até você retomar.')) return;
  try { await post('/api/pausar', { pausado: !estado.pausado }); await ciclo(); } catch (e) { avisar(e.message); }
};
$('busca').oninput = (e) => { estado.busca = e.target.value; desenharLista(); };

async function ciclo() {
  try {
    await Promise.all([carregarConversas(), carregarDante(), estado.aba === 'conversa' ? carregarConversa() : null]);
  } catch (e) { $('saude').textContent = 'Sem resposta do servidor do painel: ' + e.message; }
}
ciclo();
setInterval(ciclo, 5000);
</script>
